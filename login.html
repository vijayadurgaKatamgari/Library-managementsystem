<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - LibTrack</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="center-page">
<div class="card auth-card">
    <div class="logo">📚</div>
    <h1>Welcome back</h1>
    <p class="muted">Login to access your library dashboard.</p>
    <form action="login" method="post">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required>
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
        <button class="btn full" type="submit">Login</button>
    </form>
    <p class="center">New member? <a href="register.html">Create an account</a></p>
    <p class="center"><a href="index.html">← Back home</a></p>
</div>
</body>
</html>
